<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>価値観マップ診断</title>
<meta name="description" content="カードを仕分けて、あなたが大事にしたいことの順位を地図にする診断。職場選びの物差しづくりに。登録なし、入力はこの端末にだけ保存。">
<meta name="theme-color" content="#D3EEF3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="#/" aria-label="価値観マップ トップへ"><span class="cv" data-m="normal" data-w="30"></span>価値観マップ</a>
  <span class="sp"></span>
  <span id="barRight"></span>
</header>
<main id="app" tabindex="-1" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>

<dialog class="dlg" id="saveDlg" aria-labelledby="saveTitle">
  <button type="button" class="iconb x" id="dlgClose" aria-label="閉じる">×</button>
  <div id="saveChoose">
    <h2 id="saveTitle">保存</h2>
    <p class="small">入力内容は、この端末のブラウザに自動で保存されています。ファイルとして手元に残したいときに使ってください。</p>
    <div class="choices">
      <button type="button" class="choice" id="optText"><b>テキスト(Markdown)</b><span>コピーしてメモやAIに貼れる。.md ファイルでも保存できる</span></button>
      <button type="button" class="choice" id="optPdf"><b>PDF</b><span>キャラと図の入ったレポートを表示して、印刷機能からPDFにする</span></button>
    </div>
  </div>
  <div id="saveText" hidden>
    <h2>テキストで保存</h2>
    <textarea id="mdOut" readonly aria-label="保存するテキスト"></textarea>
    <div class="row">
      <button type="button" class="b small" id="mdCopy">コピー</button>
      <button type="button" class="b sec small" id="mdDl">.md で保存</button>
    </div>
    <p class="small" id="mdMsg" role="status"></p>
    <button type="button" class="linkb" id="mdBack">← 形式を選び直す</button>
  </div>
</dialog>

<div id="rpBar">
  <p id="rpHint"></p>
  <button type="button" class="b small" id="rpPrint">印刷・PDFに保存</button>
  <button type="button" class="b sec small" id="rpBack">もどる</button>
</div>
<div id="report"></div>

<script src="content.js"></script>
<script src="chara.js"></script>
<script src="app.js"></script>
</body>
</html>
