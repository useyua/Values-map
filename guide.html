(function(){

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const tbl=(head,rows)=>`<div class="tblwrap"><table><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
function wheel(){const R=108,cx=160,cy=150;let g=`<circle cx="${cx}" cy="${cy}" r="${R+22}" fill="none" stroke="var(--hair)" stroke-width="2"/>`;
 VALS.forEach((v,i)=>{const a=(i*36-90)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
  g+=`<g class="wv" data-i="${i}" tabindex="0" role="button" aria-label="${v.n}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="19" fill="var(--q-${v.q})" stroke="var(--outline)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+(y<cy-5?-26:33)).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor" font-family="Zen Maru Gothic, sans-serif">${v.n}</text><text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle" font-size="14" fill="#26324B">${["★","!","♪","↑","♛","☂","✿","☕","♥","☘"][i]}</text></g>`;});
 [["変化への開放性",18],["自己高揚",120],["保守",212],["自己超越",302]].forEach(([t,d])=>{const a=(d-90)*Math.PI/180;g+=`<text x="${(cx+R*.45*Math.cos(a)).toFixed(1)}" y="${(cy+R*.45*Math.sin(a)+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65" font-family="Zen Maru Gothic, sans-serif">${t}</text>`;});
 return `<svg class="wheel" viewBox="0 0 320 305" role="group" aria-label="Schwartzの10の価値の円環。タップで説明">${g}</svg><div class="card" id="wInfo" aria-live="polite"><p class="small" style="margin:0">価値をタップすると、説明とキャラが出るよ</p></div>`;}
function bindWheel(){$$(".wv").forEach(g=>{const f=()=>{const i=+g.dataset.i,v=VALS[i],c=CH.V[i];$("#wInfo").innerHTML=`<div style="display:flex;gap:12px;align-items:center"><span class="cv" data-c="${i}-${i}x" data-w="70"></span><div><b style="font:900 19px/1.3 var(--round)">${esc(v.n)}</b> <span class="qchip ${v.q}">${esc(v.q==="hed"?"開放性と自己高揚の境目":QN[v.q])}</span><p style="margin:4px 0 0">${esc(v.d)}</p><p class="small" style="margin:2px 0 0">仕事では:${esc(v.w)}</p></div></div><p class="small" style="margin:6px 0 0">カードの例:${CARDS[v.n].map(c=>esc(c[0])).join("、")}</p>`;CH.paint($("#wInfo"));$$(".wv").forEach(x=>x.classList.toggle("on",x===g));};g.addEventListener("click",f);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}});});}
const flow=(steps)=>`<div class="gflow">${steps.map((s,i)=>`${i?`<span class="ar" aria-hidden="true">↓</span>`:""}<div class="gs"><b>${esc(s[0])}</b>${s[1]?`<span>${esc(s[1])}</span>`:""}${s[2]?`<a href="index.html#/${s[2]}" class="try">やってみる →</a>`:""}</div>`).join("")}</div>`;

 {t:"はっきりさせると何が得?",s:"効果は小さいが確か。限界もある",p:10,pl:"第2章 p.10",go:[["価値観診断","m1"],["エピソード検証","m2"]],
  fig:()=>`<h3>効果の大きさ</h3>${bars([["ACT(価値の明確化が中心の心理療法)",.57,"g≈0.57"],["キャリア支援全般",.3,"d≈0.3"],["価値観アファメーション(プレッシャーの中)",.15,"小さいが確か"],["同(プレッシャーのないとき)",.01,"≈0"]],.8)}

 {t:"自分を知るのは難しい",s:"「なぜ?」より「何を?」と聞く",p:13,pl:"第3章 p.13",go:[["自己認識チェック","m3"]],
  fig:()=>`<h3>知っているつもりと、実際</h3><div class="vs2"><div><b>約95%</b><span>自分は自己認識できていると思っている人</span></div><div class="lo"><b>約10〜15%</b><span>研究の基準で、実際に自己認識が高かった人</span></div></div><p class="small">Eurichの研究チームの推計。自己評価と客観的な成績の相関も r≈0.29 にとどまる(22のメタ分析の統合)。</p>

 {t:"価値観マップの作り方",s:"8ステップを、3回に分けて",p:18,pl:"第4章 p.18",go:[["価値観診断","m1"],["エピソード検証","m2"],["ギャップ診断","m4"]],

 {t:"良い職場の条件",s:"地雷なし+誰にでも良い特徴+あなたとの適合",p:33,pl:"第6章 p.33",go:[["理想の職場","m6"]],
